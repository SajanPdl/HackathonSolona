[package]
name = "aamapay-contract"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
solana-program = "1.18"
spl-token = "3.5"
spl-associated-token-account = "3.0"
sha2 = "0.10"
bincode = "1.3"
borsh = "1.5"
thiserror = "1.0"

[dev-dependencies]
solana-program-test = "1.18"

[profile.release]
lto = true
codegen-units = 1
panic = "abort"